<!DOCTYPE html>
<html>
<head>
    <title>Saviynt Query Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
</head>
<body>

<div class="background-glow"></div>

<div class="layout">

    <div class="sidebar">
        <div class="logo">SQP</div>
        <a href="/">Dashboard</a>
        <a href="/glossary">Glossary</a>
        <a href="/search">Search</a>
        <a href="/modules">Modules</a>
        {% if session.get("admin") %}

        <div class="admin-sidebar">

            <div class="admin-header">
                <h3>Admin</h3>
            </div>

            <a href="/add" class="admin-link">Add Query</a>
            <a href="/manage" class="admin-link">Modify Queries</a>
            <a href="/bulk_upload" class="admin-link">Bulk Upload</a>
            <a href="/export" class="admin-link"
                onclick="return confirm('Do you want to download the queries CSV?')">
                Export CSV
            </a>
            <a href="/queries_table" class="admin-link">Queries Table</a>

            <div class="admin-divider"></div>

            <a href="/admin-logout" class="admin-link logout">Logout</a>

        </div>

        {% endif %}
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

</div>

</body>
</html>
