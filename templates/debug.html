{% extends "base.html" %}
{% block content %}

<div class="page-header">
    <h1 class="gradient-title">Debug Tool</h1>
    <p class="subtitle">Full query table for debugging and maintenance.</p>
</div>
<div class="debug-table-container">
    <table class="debug-table">

        <thead>
            <tr>
                {% for col in columns %}
                    <th>{{ col }}</th>
                {% endfor %}
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for q in queries %}
            <tr>

                {% for col in columns %}
                    <td>{{ q[col] }}</td>
                {% endfor %}

                <td>
                    <form method="POST" action="/delete_debug/{{ q.id }}"
                          onsubmit="return confirm('Delete this query?');">

                        <button class="delete-btn">
                            Delete
                        </button>

                    </form>
                </td>

            </tr>
            {% endfor %}
        </tbody>

    </table>
</div>

{% endblock %}
